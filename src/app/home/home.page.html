<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Günlük harcama</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Günlük harcama</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Toplam</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p class="toplam">{{ toplam | number : '1.2-2' }} ₺</p>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Yeni harcama</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="full">
        <ion-item>
          <ion-input
            label="Harcama adı"
            labelPlacement="stacked"
            [(ngModel)]="yeniAd"
            placeholder="Örn: Kahve"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            type="number"
            inputmode="decimal"
            min="0"
            step="1"
            label="Tutar (₺)"
            labelPlacement="stacked"
            [(ngModel)]="yeniTutar"
            placeholder="0"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-select
            label="Kategori"
            labelPlacement="stacked"
            interface="popover"
            placeholder="Seçin"
            [(ngModel)]="yeniKategori"
          >
            <ion-select-option *ngFor="let k of kategoriler" [value]="k.ad">
              {{ k.ad }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </ion-list>
      <ion-button expand="block" (click)="ekle()">Ekle</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="harcamalar.length > 0">
    <ion-card-header>
      <ion-card-title>Harcamalar</ion-card-title>
    </ion-card-header>
    <ion-card-content class="ion-no-padding">
      <ion-list>
        <ion-item-sliding *ngFor="let h of harcamalar">
          <ion-item [style.border-left]="'4px solid ' + kategoriRengi(h.kategori)">
            <ion-label>
              <h2>{{ h.ad }}</h2>
              <p>{{ h.tutar | number : '1.2-2' }} ₺ · {{ h.kategori }}</p>
              <p class="tarih-kucuk">{{ tarihMetni(h.tarih) }}</p>
            </ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="silOnay(h)">Sil</ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="harcamalar.length === 0">
    <ion-card-content>
      <p>Henüz harcama yok. Yukarıdan ekleyebilirsiniz.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
